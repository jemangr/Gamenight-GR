name: Release

# Each new versionName (app/build.gradle.kts) on main builds the APK and publishes it as a
# GitHub release v<versionName> (the tag is made here, on GitHub). Can also be run by hand.
on:
  push:
    branches: [main]
    paths: ['app/build.gradle.kts', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      # The release key, if the repository has it as secrets (Settings → Secrets → Actions):
      # RELEASE_KEYSTORE (the .jks in base64), RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD.
      - name: Release key
        env:
          KS: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          if [ -n "$KS" ]; then
            printf '%s' "$KS" | tr -d ' \r\n' | base64 -d > release.jks
            printf 'storeFile=release.jks\n' > keystore.properties
          fi
      - name: Tests
        run: ./gradlew :app:testDebugUnitTest
      - name: APK
        id: apk
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          v=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          ./gradlew :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "GamenightGR-$v.apk"
          # The same APK under a fixed name, for the «Download APK» button (releases/latest/download/GamenightGR.apk).
          cp app/build/outputs/apk/release/app-release.apk GamenightGR.apk
          # R8 mapping, to read the crash reports (the code is open source anyway).
          cp app/build/outputs/mapping/release/mapping.txt "GamenightGR-$v-mapping.txt"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.version }}
          name: Gamenight GR ${{ steps.apk.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            GamenightGR-${{ steps.apk.outputs.version }}.apk
            GamenightGR.apk
            GamenightGR-${{ steps.apk.outputs.version }}-mapping.txt
          body_path: docs/RELEASE.md
          # Not a pre-release, so that «latest» (the README button and the app's update check) finds it.
          prerelease: false
          make_latest: true
